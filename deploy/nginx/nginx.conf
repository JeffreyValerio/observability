worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker DNS resuelve "app" a todas las réplicas activas del servicio;
    # nginx reparte las requests entre ellas (round robin) sin necesidad
    # de conocer el número de réplicas de antemano.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        set $app_upstream app:5000;

        location / {
            proxy_pass http://$app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
